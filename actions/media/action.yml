name: ScoreKit audio and viewer stage
description: Reuse printable PDFs and produce MIDI MP3 interactive viewer and media bundles
inputs:
  source_tag:
    description: Git release tag when building a release
    required: false
    default: ''
runs:
  using: composite
  steps:
      - name: Download completed PDF print stage
        uses: actions/download-artifact@v7
        with:
          name: score-pdf-${{ github.sha }}
          path: .
      - name: Trust checkout Git directory and verify revision in container
        if: env.SCOREKIT_IMAGE_MODE == '1'
        shell: bash
        run: |
          set -euo pipefail
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git -C "$GITHUB_WORKSPACE" rev-parse --verify HEAD
          git -C "$GITHUB_WORKSPACE" describe --tags --always --long --abbrev=8 --match 'v[0-9]*'
      - name: Verify prepared CI image for media
        if: env.SCOREKIT_IMAGE_MODE == '1'
        shell: bash
        run: |
          set -euo pipefail
          command -v lilypond
          command -v fluidsynth
          command -v ffmpeg
          python3 -c 'import pypdf'
          fc-match "TeX Gyre Termes" | grep -qi "texgyre"
          test -s "${SOUNDFONT:?The prepared image must provide SOUNDFONT}"
      - name: Install pinned LilyPond from ScoreKit (legacy Ubuntu)
        if: env.SCOREKIT_IMAGE_MODE != '1'
        uses: ./scorekit/actions/install-lilypond
      - name: Reuse prepared PDF and audio tools or install missing dependencies
        if: env.SCOREKIT_IMAGE_MODE != '1'
        shell: bash
        run: |
          set -euo pipefail
          if python3 -c 'import pypdf' >/dev/null 2>&1 \
             && command -v fluidsynth >/dev/null 2>&1 \
             && command -v ffmpeg >/dev/null 2>&1 \
             && command -v fc-match >/dev/null 2>&1 \
             && fc-match "TeX Gyre Termes" | grep -qi "texgyre"; then
            echo "PDF and audio dependencies are already installed; skip APT"
          else
            # Fallback for local or stock-runner use without the prepared image.
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends \
              python3-pypdf fonts-texgyre fluidsynth ffmpeg
          fi
      - name: Reuse packaged MS Basic SoundFont or download it on a plain runner
        if: env.SCOREKIT_IMAGE_MODE != '1'
        shell: bash
        run: |
          set -euo pipefail
          if test -s /opt/soundfonts/MS_Basic.sf3 \
             && test "$(stat -c %s /opt/soundfonts/MS_Basic.sf3)" -gt 50000000; then
            echo "SOUNDFONT=/opt/soundfonts/MS_Basic.sf3" >> "$GITHUB_ENV"
            echo "Use packaged MS Basic SoundFont"
          else
            mkdir -p soundfonts
            curl --retry 3 -fLsS --output soundfonts/MS_Basic.sf3 \
              "https://raw.githubusercontent.com/musescore/MuseScore/0e44d8e1dd7e0cad1fac85915330c5225bd7882e/share/sound/MS%20Basic.sf3"
            test "$(stat -c %s soundfonts/MS_Basic.sf3)" -gt 50000000
            echo "SOUNDFONT=soundfonts/MS_Basic.sf3" >> "$GITHUB_ENV"
          fi
      - name: Build MIDI and audio without reprinting PDFs
        shell: bash
        env:
          SOURCE_TAG: ${{ inputs.source_tag }}
        run: |
          set -euo pipefail
          python3 scorekit/scripts/build.py build --audio --reuse-pdf
          python3 scorekit/scripts/build.py package --full
      - name: Upload synchronized media and viewer bundle
        uses: actions/upload-artifact@v6
        with:
          name: score-media-${{ github.sha }}
          path: |
            dist/audio/*.mp3
            dist/audio/stems/*.mp3
            dist/packages/*-audio-*.zip
            dist/packages/*-viewer-*.zip
            dist/viewer/index.html
            dist/viewer/manifest.json
            dist/viewer/timeline.json
            dist/viewer/**/*.svg
            dist/viewer/*.json
          if-no-files-found: error
          retention-days: 14
